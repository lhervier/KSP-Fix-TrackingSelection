// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Takes each row the tracking station removes from its list out of the list's toggle group at once. On stock,
// those rows, destroyed at the end of the frame, make the group light the top row of the new list when no
// vessel of it is selected: that row shows as selected, while no vessel is, and a click on it does nothing.
releaseRemovedRows = True

// Deselects the tracking station's selected vessel when the vessel type filters hide it. On stock, it stays
// selected without a row in the list, and Fly, Recover and Terminate act on it.
deselectHiddenVessel = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line for each row a
// rebuild of the list removes, and one for each vessel deselected because the filters hide it.
logLevel = Info
